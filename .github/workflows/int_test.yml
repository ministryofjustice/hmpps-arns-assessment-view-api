name: Integration Test

on:
  push:
    branches:
      - 'test/sentence-plan-api'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'
  workflow_call:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'

permissions:
  contents: read

jobs:
  inttest:
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: java --version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run e2e tests
        run: ./gradlew e2eTest
        env:
          ARNS_ASSESSMENT_VIEW_CLIENT_ID: ${{ secrets.ARNS_ASSESSMENT_VIEW_CLIENT_ID }}
          ARNS_ASSESSMENT_VIEW_CLIENT_SECRET: ${{ secrets.ARNS_ASSESSMENT_VIEW_CLIENT_SECRET }}
          AAP_CLIENT_ID: ${{ secrets.ARNS_ASSESSMENT_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.ARNS_ASSESSMENT_CLIENT_SECRET }}
          AAP_TEST_URL: ${{ fromJSON(vars.INT_TEST_DATA)[inputs.environment].aapUrl }}
          ARNS_COORDINATOR_URL: ${{ fromJSON(vars.INT_TEST_DATA)[inputs.environment].coordinatorUrl }}
          ARNS_ASSESSMENT_VIEW_BASE_URL: ${{ fromJSON(vars.INT_TEST_DATA)[inputs.environment].url }}

      - name: Upload test results
        if: '!cancelled()'
        uses: actions/upload-artifact@v5
        with:
          name: int-test-results-${{ inputs.environment }}
          path: |
            build/test-results
            build/reports/tests
